version: '3'

vars:
  TOFU: '{{default "tofu" .TOFU}}'
  # terraform-docs v0.20.0
  TERRAFORM_DOCS_IMAGE: 'quay.io/terraform-docs/terraform-docs@sha256:37329e2dc2518e7f719a986a3954b10771c3fe000f50f83fd4d98d489df2eae2'

tasks:
  default:
    desc: List available development tasks
    cmds:
      - task --list

  fmt:
    desc: Format OpenTofu configuration
    cmds:
      - '{{.TOFU}} fmt -recursive'

  fmt:check:
    desc: Check OpenTofu formatting
    cmds:
      - '{{.TOFU}} fmt -check -recursive'

  init:
    desc: Initialize the root module without configuring a backend
    cmds:
      - '{{.TOFU}} init -backend=false'

  validate:
    desc: Initialize and validate the root module with OpenTofu
    deps: [init]
    cmds:
      - '{{.TOFU}} validate'

  lint:
    desc: Lint all OpenTofu configurations with TFLint
    cmds:
      - tflint --recursive

  docs:
    desc: Regenerate OpenTofu input and output documentation in README.md
    cmds:
      - 'docker run --rm --volume "{{.ROOT_DIR}}:/terraform-docs" --workdir /terraform-docs --user "$(id -u):$(id -g)" {{.TERRAFORM_DOCS_IMAGE}} markdown table .'

  docs:check:
    desc: Check that OpenTofu documentation in README.md is current
    cmds:
      - 'docker run --rm --volume "{{.ROOT_DIR}}:/terraform-docs" --workdir /terraform-docs --user "$(id -u):$(id -g)" {{.TERRAFORM_DOCS_IMAGE}} markdown table --output-check .'

  test:native:
    desc: Run mocked native OpenTofu tests without creating infrastructure
    cmds:
      - '{{.TOFU}} test -no-color'

  test:
    desc: Run all module tests
    deps: [test:native]

  ci:
    desc: Run every check used by continuous integration
    cmds:
      - task fmt:check
      - task validate
      - task lint
      - task docs:check
      - task test

  release:plugins:
    desc: Restore the semrel release plugins pinned in .semrel.lock
    cmds:
      - semrel plugin restore

  release:check:
    desc: Run CI checks and preview the next release without changing GitHub or git
    deps: [ci, release:plugins]
    cmds:
      - semrel doctor
      - semrel lint
      - semrel release --dry-run

  release:prepare:
    internal: true
    cmds:
      - 'git config user.name >/dev/null || git config user.name "${GIT_RELEASE_NAME:-github-actions[bot]}"'
      - 'git config user.email >/dev/null || git config user.email "${GIT_RELEASE_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"'

  release:
    desc: Create and publish a release from master; requires GitHub credentials
    deps: [release:check, release:prepare]
    cmds:
      - semrel release
